[package]
name = "espo"
version = "0.1.0"
edition = "2024"
default-run = "espo"

[lib]
name = "espo"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "espo"
path = "src/main.rs"
required-features = ["binary"]

[features]
# Feature that's only available for non-WASM builds.
#
# The binary always runs on jemalloc: glibc's malloc never returns freed
# request/block buffers to the OS (per-thread arenas plus a dynamic mmap
# threshold that ratchets to 32 MiB), so a long-running espo accumulates tens
# of GB of freed-but-retained heap until it OOMs. `unprefixed_malloc_on_
# supported_platforms` routes RocksDB's C++ allocations through jemalloc too.
binary = [
    "dep:tikv-jemallocator",
    "tikv-jemallocator/unprefixed_malloc_on_supported_platforms",
]
jemalloc-prof = ["binary", "dep:tikv-jemalloc-ctl", "tikv-jemallocator/profiling"]
test-utils = ["alkanes", "metashrew-runtime", "rockshrew-runtime", "wasmtime", "protorune/test-utils"]

[dependencies]
anyhow = "1.0.99"
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
protobuf-json-mapping = "3.7.2"
serde_json = "1.0.143"
borsh = { version = "1.5.7", features = ["derive"] }
futures = "0.3.31"
bitcoin = { version = "0.32.7", features = ["serde"] }
prost = "0.12.6"
maud = "0.26.0"
wasm-bindgen = "0.2.121"

# Consensus alkanes-rs dependencies from the canonical v2.2.1 alpha tag.
alkanes-support = { git = "https://github.com/kungfuflex/alkanes-rs", tag = "v2.2.1-alpha.1" }
ordinals = { git = "https://github.com/kungfuflex/alkanes-rs", tag = "v2.2.1-alpha.1" }
protorune-support = { git = "https://github.com/kungfuflex/alkanes-rs", tag = "v2.2.1-alpha.1" }
metashrew-support = { git = "https://github.com/sandshrewmetaprotocols/metashrew", tag = "v9.0.5-rc.8" }

# Non-WASM dependencies (server, network, DB, CLI, etc.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22.0"
clap = { version = "4.5.47", features = ["derive"] }
rocksdb = "0.21.0"
tempfile = "3.22"
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
electrum-client = "0.24.0"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
ureq = { version = "2.12", features = ["json"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
tarpc = { version = "0.37", features = ["tokio1", "serde1", "serde-transport", "tcp"] }
tokio-stream = "0.1.17"
tokio-serde = {version = "0.9.0", features = ["json"]}
time = { version = "0.3.36", features = ["formatting"] }
alloy-primitives = "0.8.7"
bitcoincore-rpc = "0.19.0"
tower-http = { version = "0.5", features = ["cors"] }
alkanes-cli-common = { git = "https://github.com/kungfuflex/alkanes-rs", branch = "develop" }
alkabi = { git = "https://github.com/bitapeslabs/alkabi-rs", rev = "5982b11f9138de7db22a1e27de9f3d8b8f322655", features = ["extract"] }
zmq = "0.10"
tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true }

# Required dependencies for alkanes support (from alkanes-rs)
metashrew-core = { git = "https://github.com/sandshrewmetaprotocols/metashrew", tag = "v9.0.5-rc.8" }
protorune = { git = "https://github.com/kungfuflex/alkanes-rs", tag = "v2.2.1-alpha.1" }

# Optional dependencies for test utilities
alkanes = { git = "https://github.com/kungfuflex/alkanes-rs", tag = "v2.2.1-alpha.1", optional = true }
metashrew-runtime = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "50b4c70ac0705838cd7dbfa1058c9cbb584e3b3a", optional = true }
rockshrew-runtime = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "50b4c70ac0705838cd7dbfa1058c9cbb584e3b3a", optional = true }
wasmtime = { version = "18.0", features = ["async"], optional = true }

[dev-dependencies]
alkanes = { git = "https://github.com/kungfuflex/alkanes-rs", tag = "v2.2.1-alpha.1", features = ["test-utils"] }
metashrew-core = { git = "https://github.com/sandshrewmetaprotocols/metashrew", tag = "v9.0.5-rc.8", features = ["test-utils"] }
protorune = { git = "https://github.com/kungfuflex/alkanes-rs", tag = "v2.2.1-alpha.1", features = ["test-utils"] }
alkanes-runtime = { git = "https://github.com/kungfuflex/alkanes-rs", tag = "v2.2.1-alpha.1" }
tower = { version = "0.5", features = ["util"] }
wasm-bindgen-test = "0.3.71"
